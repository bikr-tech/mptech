<!-- Email Header - Reusable Component -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #1e3a5f; border-radius: 8px 8px 0 0; padding: 24px;">
    <tr>
        <td style="text-align: center;">
            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 700;">{{brand_name}}</h1>
            <p style="margin: 8px 0 0; color: #93c5fd; font-size: 14px;">{{brand_tagline}}</p>
        </td>
    </tr>
</table>
